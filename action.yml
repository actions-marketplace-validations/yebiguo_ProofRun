name: 'ProofRun Verify'
# Marketplace enforces a 125-character cap on this field — see the "Known
# limitation" callout in the README's "GitHub Action" section for the
# .proofrun.yml-tampering caveat that used to live here; it didn't fit and
# doesn't belong in an elevator pitch.
description: 'Re-runs .proofrun.yml checks against the exact PR head commit. Never trusts a receipt.json checked out from the PR branch.'
branding:
  icon: 'check-circle'
  color: 'green'
runs:
  using: 'composite'
  steps:
    - name: Checkout exact PR head (authoritative — not delegated to the caller)
      # This action performs its own checkout rather than trusting whatever
      # the calling workflow already checked out. A version that only
      # *validated* the caller's checkout could correctly catch the most
      # common mistake (forgetting to pin `ref:` to the PR head, which
      # defaults to GitHub's synthetic merge-preview commit on
      # `pull_request` events) — but the fix for that failure is exactly
      # the wrong instinct: delete the validation step to make the error
      # go away. Doing the checkout here removes the whole failure class
      # instead of documenting around it.
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0 # need base ref history for the .proofrun.yml diff step below
        # The PR's own declared checks run later in this job (`run-all`).
        # persist-credentials defaults to true, which would leave the
        # GITHUB_TOKEN readable from .git/config for the rest of the job —
        # readable, in particular, by whatever the PR's .proofrun.yml tells
        # this job to execute. This action never needs git credentials
        # (read-only checkout, no push), so there's no reason to leave one
        # sitting around for PR-supplied commands to find.
        persist-credentials: false

    - name: Assert checked-out HEAD is really the PR head, not a merge preview
      shell: bash
      run: |
        actual="$(git rev-parse HEAD)"
        expected="${{ github.event.pull_request.head.sha }}"
        if [ -n "$expected" ] && [ "$actual" != "$expected" ]; then
          echo "::error::checked out HEAD ($actual) does not match the PR head sha ($expected). This should be unreachable given this action's own checkout step above — please open an issue at https://github.com/yebiguo/proofrun/issues rather than removing this check."
          exit 1
        fi

    - name: Warn if .proofrun.yml itself changed relative to the base branch
      shell: bash
      run: |
        base="${{ github.event.pull_request.base.sha }}"
        # `if` conditions are exempt from bash's `set -e` (on by default in
        # GitHub Actions bash steps) — `git diff --quiet` exiting 1 here
        # means "a difference was found", the case we want to act on, not
        # a script failure to abort on.
        if [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- .proofrun.yml 2>/dev/null; then
          echo "::warning::.proofrun.yml differs from the base branch in this PR. ProofRun re-runs whatever the check declarations say to run — it proves the declared checks really executed, but this version does not protect the declarations themselves from being weakened by the same PR that changes the code. Review this diff like you would any other part of the change."
        fi

    - name: Download proofrun
      shell: bash
      run: |
        set -e
        case "${{ runner.os }}" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error::unsupported runner.os: ${{ runner.os }}"; exit 1 ;;
        esac
        case "${{ runner.arch }}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::unsupported runner.arch: ${{ runner.arch }}"; exit 1 ;;
        esac

        ext=tar.gz
        if [ "$os" = "windows" ]; then ext=zip; fi
        archive="proofrun_${os}_${arch}.${ext}"
        # PIN_VERSION is a literal, not derived from github.action_ref at
        # runtime. Two reasons: (1) GitHub advises against interpolating
        # context values straight into `run:` scripts; (2) more
        # fundamentally, action_ref is only ever a real release tag for a
        # `@vX.Y.Z`-style reference — a consumer who does the officially
        # recommended thing and pins by full commit SHA (or by branch) gets
        # an action_ref that isn't a release tag at all, and guessing a
        # tag-shaped URL from it breaks the download outright.
        #
        # Bumped as part of cutting each real release (see the release-prep
        # step in AGENTS.md) so this exact commit always downloads the
        # binary that matches it: pin `@v0.2.0`, or the full SHA of that
        # same commit, or the floating `@v1` tag on the day it happens to
        # point here — all three resolve the identical action.yml content
        # with the identical PIN_VERSION baked in, no ref-sniffing needed.
        # Unreleased commits (main, a dev branch) keep the floating "v1"
        # default below, which is the right behavior for something nobody
        # should be pinning to in the first place.
        pin_version="v0.3.0"
        base_url="https://github.com/yebiguo/proofrun/releases/download/${pin_version}"

        workdir="${RUNNER_TEMP}/proofrun-install"
        mkdir -p "$workdir"
        curl -fsSL -o "$workdir/$archive" "$base_url/$archive"
        curl -fsSL -o "$workdir/checksums.txt" "$base_url/checksums.txt"

        # tr -d '\r' guards against a checksums.txt with CRLF line endings
        # (e.g. hand-built/re-uploaded from a Windows machine) silently
        # failing to match here — the trailing \r would sit between the
        # filename and grep's end-of-line anchor.
        expected_sum="$(tr -d '\r' < "$workdir/checksums.txt" | grep " ${archive}\$" | awk '{print $1}')"
        if [ -z "$expected_sum" ]; then
          echo "::error::no checksum entry for $archive in checksums.txt — refusing to use an unverifiable download"
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          actual_sum="$(sha256sum "$workdir/$archive" | awk '{print $1}')"
        elif command -v shasum >/dev/null 2>&1; then
          actual_sum="$(shasum -a 256 "$workdir/$archive" | awk '{print $1}')"
        else
          actual_sum="$(openssl dgst -sha256 "$workdir/$archive" | awk '{print $NF}')"
        fi
        # sha256sum/shasum prepend a literal backslash to the whole output
        # line (not just the filename) when the path contains a backslash —
        # e.g. RUNNER_TEMP on Windows runners mixes \ and / separators. That
        # marker ends up as part of $1 too, corrupting the naive awk parse.
        actual_sum="${actual_sum#\\}"
        if [ "$expected_sum" != "$actual_sum" ]; then
          echo "::error::checksum mismatch for $archive: expected $expected_sum, got $actual_sum — refusing to run a download that doesn't match the published checksum"
          exit 1
        fi

        if [ "$ext" = "zip" ]; then
          if command -v unzip >/dev/null 2>&1; then
            unzip -q "$workdir/$archive" -d "$workdir"
          else
            tar xf "$workdir/$archive" -C "$workdir"
          fi
        else
          tar xzf "$workdir/$archive" -C "$workdir"
        fi

        chmod +x "$workdir/proofrun" 2>/dev/null || true
        echo "$workdir" >> "$GITHUB_PATH"

    - name: Clear any existing local receipt — never trust one checked out from the PR branch
      shell: bash
      run: rm -rf .proofrun/

    - name: Re-run every declared check for real
      shell: bash
      continue-on-error: true # let the strict-mode step below produce the final, cleanly-reported gate
      run: proofrun run-all

    - name: Gate on strict status
      shell: bash
      run: proofrun status --strict
