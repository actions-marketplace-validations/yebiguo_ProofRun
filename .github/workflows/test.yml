name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@proofrun.dev"
          git config --global user.name "ProofRun CI"

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v
